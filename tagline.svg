<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="正在寻找：大模型算法 / AI Infra / 数据 / Agent / 服务端 人才">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .live { animation: live 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes live { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    .role { opacity: 0; animation: cycle 15s ease-in-out infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; } .r5 { animation-delay: 12s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(14px); }
      3% { opacity: 1; transform: translateY(0); }
      17% { opacity: 1; transform: translateY(0); }
      20% { opacity: 0; transform: translateY(-14px); }
      100% { opacity: 0; transform: translateY(-14px); }
    }
  </style>
  <circle class="ring" cx="214" cy="33" r="6" fill="#22C55E"/>
  <circle class="live" cx="214" cy="33" r="6" fill="#22C55E"/>
  <text x="232" y="41" font-size="22" font-weight="700" fill="#8B5CF6">正在寻找<tspan dx="8" fill="#A78BFA">›</tspan></text>
  <g font-size="22" font-weight="600" fill="url(#g)">
    <text class="role r1" x="346" y="41">预训练 / 后训练 / RL 研究员</text>
    <text class="role r2" x="346" y="41">训练推理框架 · 高性能算子工程师</text>
    <text class="role r3" x="346" y="41">预训练数据 · 数据平台工程师</text>
    <text class="role r4" x="346" y="41">Agent · Code Agent 研发工程师</text>
    <text class="role r5" x="346" y="41">服务端 · 分布式系统工程师</text>
  </g>
</svg>
