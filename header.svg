<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Linden Liu · 大模型方向技术猎头">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.55" stop-color="#141A3E"/>
      <stop offset="1" stop-color="#2B1A5E"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .halo { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; } .d5 { animation-delay: 2.4s; }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: .7; transform: scale(1.25); } }
    .flow { stroke-dasharray: 4 9; animation: dash 5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -130; } }
    .orbit { animation: spin 60s linear infinite; transform-origin: 960px 185px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .twinkle { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <circle cx="1000" cy="40" r="300" fill="url(#glowViolet)"/>
    <circle cx="90" cy="380" r="260" fill="url(#glowCyan)"/>
    <circle cx="960" cy="185" r="170" fill="url(#glowViolet)" opacity="0.5"/>

    <circle class="twinkle" cx="700" cy="60" r="1.6" fill="#E0E7FF"/>
    <circle class="twinkle" style="animation-delay:1.3s" cx="1150" cy="300" r="1.8" fill="#E0E7FF"/>
    <circle class="twinkle" style="animation-delay:2.1s" cx="760" cy="320" r="1.4" fill="#E0E7FF"/>
    <circle class="twinkle" style="animation-delay:.7s" cx="1160" cy="70" r="1.4" fill="#E0E7FF"/>
    <circle class="twinkle" style="animation-delay:2.8s" cx="640" cy="200" r="1.2" fill="#E0E7FF"/>

    <g class="orbit">
      <circle cx="960" cy="185" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-dasharray="2 8"/>
    </g>
    <polygon points="883.6,79.8 1036.4,79.8 1083.6,225.2 960,315 836.4,225.2" fill="none" stroke="#A78BFA" stroke-opacity="0.18"/>
    <g stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75">
      <line class="flow" x1="960" y1="185" x2="883.6" y2="79.8"/>
      <line class="flow" x1="960" y1="185" x2="1036.4" y2="79.8"/>
      <line class="flow" x1="960" y1="185" x2="1083.6" y2="225.2"/>
      <line class="flow" x1="960" y1="185" x2="960" y2="315"/>
      <line class="flow" x1="960" y1="185" x2="836.4" y2="225.2"/>
    </g>

    <circle class="halo d1" cx="883.6" cy="79.8" r="17" fill="#5EEAD4"/>
    <circle cx="883.6" cy="79.8" r="8" fill="#5EEAD4"/>
    <circle class="halo d2" cx="1036.4" cy="79.8" r="17" fill="#A78BFA"/>
    <circle cx="1036.4" cy="79.8" r="8" fill="#A78BFA"/>
    <circle class="halo d3" cx="1083.6" cy="225.2" r="17" fill="#38BDF8"/>
    <circle cx="1083.6" cy="225.2" r="8" fill="#38BDF8"/>
    <circle class="halo d4" cx="960" cy="315" r="17" fill="#FBBF24"/>
    <circle cx="960" cy="315" r="8" fill="#FBBF24"/>
    <circle class="halo d5" cx="836.4" cy="225.2" r="17" fill="#F472B6"/>
    <circle cx="836.4" cy="225.2" r="8" fill="#F472B6"/>

    <g font-size="15" font-weight="600" fill="#CBD5E1">
      <text x="856" y="84" text-anchor="end">LLM 算法</text>
      <text x="1064" y="84">AI Infra</text>
      <text x="1111" y="230">数据</text>
      <text x="988" y="320">服务端</text>
      <text x="809" y="230" text-anchor="end">Agent</text>
    </g>

    <circle cx="960" cy="185" r="34" fill="none" stroke="#A78BFA" stroke-width="2">
      <animate attributeName="r" values="34;78" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="185" r="34" fill="url(#core)"/>
    <circle cx="960" cy="185" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="960" y="194" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">你</text>
  </g>

  <text x="74" y="92" font-size="14" font-weight="700" letter-spacing="4" fill="#5EEAD4">AI TALENT PARTNER · LLM HEADHUNTER</text>
  <text x="70" y="168" font-size="74" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Linden Liu</text>
  <rect x="74" y="190" width="132" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="238" font-size="28" font-weight="700" fill="#F1F5F9">大模型方向技术猎头<tspan font-size="21" font-weight="500" fill="#A5B4FC" dx="14">懂技术，也懂你的下一步</tspan></text>

  <text x="74" y="300" font-size="14" font-weight="600" fill="#94A3B8">在招团队</text>
  <g font-size="15" font-weight="600" fill="#F8FAFC" text-anchor="middle">
    <rect x="148" y="279" width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="200" y="300">DeepSeek</text>
    <rect x="262" y="279" width="82" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="303" y="300">小红书</text>
    <rect x="354" y="279" width="100" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="404" y="300">阶跃星辰</text>
    <rect x="464" y="279" width="96" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="512" y="300">MiniMax</text>
    <rect x="570" y="279" width="86" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="3 4"/>
    <text x="613" y="300" fill="#CBD5E1">+ 更多</text>
  </g>
</svg>
