    .wave1 { animation: drift 14s linear infinite; }
    .wave2 { animation: drift 20s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <g class="wave2">
      <path d="M0 132 C 150 112, 300 152, 450 132 S 750 112, 900 132 S 1200 152, 1350 132 S 1650 112, 1800 132 L1800 170 L0 170 Z" fill="url(#w2)"/>
    </g>
    <g class="wave1">
