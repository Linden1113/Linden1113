<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="好的机会，值得被认真讲清楚。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.6" stop-color="#141A3E"/>
      <stop offset="1" stop-color="#2B1A5E"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="170" rx="24"/></clipPath>
