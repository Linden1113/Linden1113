    </g>
  </g>
  <text x="600" y="72" text-anchor="middle" font-size="27" font-weight="700" fill="#F8FAFC">好的机会，值得被认真讲清楚。</text>
  <text x="600" y="106" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#94A3B8">LINDEN LIU · AI TALENT PARTNER · WECHAT mt19102618278</text>
